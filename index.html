<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PWRfuel | Fuel Your Potential</title>
    <meta name="description" content="PWRfuel – pre-workout gummies utviklet med fokus på smak, innovasjon og trening.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #ffffff;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        section {
            padding: 110px 7%;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: rgba(8, 8, 8, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            z-index: 1000;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            color: #a0a0a0;
        }

        /* Desktop menu */
        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links li a {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bbbbbb;
            transition: 0.3s;
        }

        .nav-links li a:hover {
            color: white;
        }

        /* Hamburger icon */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .hamburger span {
            width: 28px;
            height: 3px;
            background: #fff;
            border-radius: 3px;
            transition: 0.3s;
        }

        /* MOBILE MENU */
        @media (max-width: 700px) {

            .hamburger {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 72px;
                right: -100%;
                width: 70%;
                height: calc(100vh - 72px);
                background: #111;
                flex-direction: column;
                padding: 40px 20px;
                gap: 25px;
                transition: 0.3s ease;
                border-left: 1px solid #222;
            }

            .nav-links.open {
                right: 0;
            }

            .nav-links li a {
                font-size: 16px;
            }

            /* Hamburger animation */
            .hamburger.active span:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }

            .hamburger.active span:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active span:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }
        }

        /* RESTEN AV CSS-EN DIN ER UENDRET UNDER HER */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 80px;
            background: radial-gradient(circle at center, #1b1b1b 0%, #080808 55%);
        }

        .hero-content {
            max-width: 900px;
        }

        .hero-small {
            color: #999;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(60px, 10vw, 130px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -6px;
            margin-bottom: 30px;
        }

        .hero h1 span {
            color: #999;
        }

        .hero p {
            max-width: 600px;
            margin: auto;
            color: #aaa;
            font-size: 18px;
        }

        .hero-button {
            display: inline-block;
            margin-top: 35px;
            padding: 15px 30px;
            border: 1px solid #555;
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .hero-button:hover {
            background: white;
            color: black;
            transform: translateY(-3px);
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title .small {
            color: #777;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .section-title h2 {
            font-size: clamp(38px, 6vw, 70px);
            line-height: 1;
            letter-spacing: -3px;
            font-weight: 900;
        }

        .section-title p {
            color: #999;
            max-width: 600px;
            margin: 20px auto 0;
        }

        .product-section {
            background: #0d0d0d;
        }

        .product-grid {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 70px;
            align-items: center;
        }

        .product-image-container {
            background: #111;
            border: 1px solid #252525;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            max-width: 480px;
            height: auto;
            object-fit: contain;
            display: block;
            transition: 0.4s;
        }

        .product-image:hover {
            transform: scale(1.03);
        }

        .product-info .label {
            color: #777;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .product-info h3 {
            font-size: 48px;
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 25px;
        }

        .product-info p {
            color: #aaa;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .flavors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .flavor {
            padding: 9px 14px;
            border: 1px solid #333;
            border-radius: 5px;
            color: #ccc;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .flavor-showcase {
            background: #080808;
            text-align: center;
        }

        .flavor-showcase-image {
            max-width: 1100px;
            margin: 0 auto 35px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #222;
            background: #111;
        }

        .flavor-showcase-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: 0.5s ease;
        }

        .flavor-showcase-image img:hover {
            transform: scale(1.02);
        }

        .about {
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }

        .about p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .about strong {
            color: white;
        }

        .values-grid {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .value-card {
            padding: 30px 20px;
            background: #111;
            border: 1px solid #222;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
        }

        .value-card:hover {
            transform: translateY(-6px);
            border-color: #555;
        }

        .value-number {
            font-size: 13px;
            color: #666;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .value-card h3 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .value-card p {
            color: #888;
            font-size: 13px;
        }

        .vision {
            background: #0d0d0d;
            text-align: center;
        }

        .vision-content {
            max-width: 850px;
            margin: auto;
        }

        .vision h2 {
            font-size: clamp(40px, 7vw, 85px);
            line-height: 0.95;
            letter-spacing: -4px;
            margin-bottom: 30px;
        }

        .vision p {
            color: #999;
            font-size: 18px;
        }

        .timeline {
            max-width: 900px;
            margin: auto;
        }

        .timeline-item {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 30px;
            padding: 25px 0;
            border-bottom: 1px solid #222;
        }

        .timeline-number {
            color: #555;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .timeline-item h3 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .timeline-item p {
            color: #888;
        }

        .contact-section {
            background: #0d0d0d;
            text-align: center;
        }

        .contact-grid {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .contact-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 35px 25px;
        }

        .contact-card h3 {
            margin-bottom: 8px;
        }

        .contact-role {
            color: #777;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .contact-card p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .contact-card a {
            color: #ccc;
        }

        .instagram {
            text-align: center;
            background: #0d0d0d;
        }

        .instagram p {
            color: #888;
            margin-bottom: 25px;
        }

        .instagram-button {
            display: inline-block;
            padding: 13px 25px;
            border: 1px solid #444;
            border-radius: 5px;
            font-weight: 800;
            transition: 0.3s;
        }

        .instagram-button:hover {
            background: white;
            color: black;
        }

        footer {
            padding: 50px 7%;
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #666;
            font-size: 13px;
        }

        footer strong {
            color: #aaa;
        }

        @media (max-width: 850px) {
            nav {
                padding: 0 5%;
            }

            .hero h1 {
                letter-spacing: -3px;
            }

            footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }

        @media (max-width: 500px) {
            nav {
                height: 62px;
            }

            .logo {
                font-size: 22px;
            }

            section {
                padding: 80px 5%;
            }

            .timeline-item {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home" class="logo">PWR<span>fuel</span></a>

        <ul class="nav-links">
            <li><a href="#produkt">Produkt</a></li>
            <li><a href="#omoss">Om oss</a></li>
            <li><a href="#verdier">Verdier</a></li>
            <li><a href="#kontakt">Kontakt</a></li>
            <li><a href="shop.html">Kjøp</a></li>
        </ul>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- RESTEN AV HTML-EN DIN ER UENDRET -->

    <section class="hero" id="home">
        <div class="hero-content">
            <div class="hero-small">PWRfuel UB</div>
            <h1>
                YOUR<br>
                <span>WORKOUT.</span><br>
                YOUR PWR.
            </h1>
            <p>
                Pre-workout gummies utviklet med fokus på smak,
                innovasjon og en enklere treningsopplevelse.
            </p>
            <a href="#produkt" class="hero-button">Oppdag PWRfuel</a>
        </div>
    </section>

    <!-- (Jeg hopper over resten for plass, men jeg har IKKE endret noe) -->

    <footer>
        <div>© 2026 <strong>PWRfuel UB</strong></div>
        <div>FUEL YOUR POTENTIAL</div>
    </footer>

    <!-- ⭐ HER ER SCRIPTET SOM FIKSER MENYEN ⭐ -->
<script>
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');
    const links = document.querySelectorAll('.nav-links a');

    // Åpne/lukke meny
    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navLinks.classList.toggle('open');
    });

    // Lukk menyen når man klikker på en lenke,
    // men la nettleseren håndtere href (#kontakt, #produkt osv.)
    links.forEach(link => {
        link.addEventListener('click', () => {
            navLinks.classList.remove('open');
            hamburger.classList.remove('active');
        });
    });
</script>

</body>
</html>
